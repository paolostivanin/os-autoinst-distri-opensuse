# KDC configuration for the FIPS requests-gssapi test.
# The realm is restricted to the two FIPS-approved AES256 enctypes, so that a
# non-approved enctype cannot be negotiated at all. This mirrors the
# master_key_type/supported_enctypes that tests/security/krb5/krb5_crypt_prepare.pm
# injects into the shipped kdc.conf for the multi-machine krb5 test, but the file
# is written in full here instead of being patched, so the result does not depend
# on the layout of the file that krb5-server ships.
[kdcdefaults]
    kdc_ports = 750,88

[realms]
    EXAMPLE.COM = {
        key_stash_file = /var/lib/kerberos/krb5kdc/.k5.EXAMPLE.COM
        kdc_ports = 750,88
        max_life = 10h 0m 0s
        max_renewable_life = 7d 0h 0m 0s
        master_key_type = aes256-cts-hmac-sha384-192
        supported_enctypes = aes256-cts-hmac-sha384-192:normal aes256-cts-hmac-sha1-96:normal
    }

[logging]
    kdc = FILE:/var/log/krb5/krb5kdc.log
    admin_server = FILE:/var/log/krb5/kadmind.log
    default = SYSLOG:NOTICE:DAEMON
