# Apache virtual host that serves HTTPS and protects /protected with mod_auth_gssapi.
# @FQDN@ is replaced with the output of 'hostname -f' by the pytest fixtures.
<VirtualHost *:443>
    ServerName @FQDN@
    HostnameLookups Off
    DocumentRoot /srv/www/htdocs
    UseCanonicalName Off

    <Directory "/srv/www/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride None
        <IfModule !mod_access_compat.c>
            Require all granted
        </IfModule>
        <IfModule mod_access_compat.c>
            Order allow,deny
            Allow from all
        </IfModule>
    </Directory>

    SSLEngine on
    SSLCertificateFile     /etc/apache2/ssl.crt/gssapi-fips.crt
    SSLCertificateKeyFile  /etc/apache2/ssl.key/gssapi-fips.key

    # SPNEGO/Kerberos authentication of the HTTP/<hostname -f> service principal
    <Location "/protected">
        AuthType GSSAPI
        AuthName "Kerberos SPNEGO"
        GssapiCredStore keytab:/etc/apache2/http.keytab
        GssapiAllowedMech krb5
        Require valid-user
    </Location>
</VirtualHost>
