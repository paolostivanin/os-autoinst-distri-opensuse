# Kerberos client configuration for the FIPS requests-gssapi test.
# @FQDN@ is replaced with the output of 'hostname -f' by the pytest fixtures.
[libdefaults]
    default_realm = EXAMPLE.COM
    fipslevel = 3
    allow_weak_crypto = false
    dns_canonicalize_hostname = false
    rdns = false
    ignore_acceptor_hostname = true
    permitted_enctypes = aes256-cts-hmac-sha384-192 aes256-cts-hmac-sha1-96
    default_tgs_enctypes = aes256-cts-hmac-sha384-192 aes256-cts-hmac-sha1-96
    default_tkt_enctypes = aes256-cts-hmac-sha384-192 aes256-cts-hmac-sha1-96

[realms]
    EXAMPLE.COM = {
        kdc = localhost
        admin_server = localhost
    }

[domain_realm]
    @FQDN@ = EXAMPLE.COM

[logging]
    kdc = FILE:/var/log/krb5/krb5kdc.log
    admin_server = FILE:/var/log/krb5/kadmind.log
    default = SYSLOG:NOTICE:DAEMON
